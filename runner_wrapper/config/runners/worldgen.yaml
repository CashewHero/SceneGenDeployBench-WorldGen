catalog_version: 1

runners:
  - runner: worldgen-panorama
    version: 0.1.0
    latest: true
    display_name: WorldGen Panorama
    kind: generator
    contract_version: 1
    inputs:
      data:
        required_sample:
          required_datatype:
            - image
    job_parameters: {}
    scheduling:
      # Ten sequential jobs amortize container startup while bounding CUDA and model-library state lifetime.
      max_batch_size: 10
      # One retry covers transient model-download, container, and GPU failures.
      max_attempts: 2
      job_timeout_minutes: 60
      startup_timeout_minutes: 5
    launcher:
      driver: docker
      compat_version: 1
      image: ghcr.io/cashewhero/scenegendeploybench-worldgen:0.1.0
      gpus: 1
      endpoint:
        port: 58090
      env:
        HF_HOME: /data/model_cache/worldgen/huggingface
        TORCH_HOME: /data/model_cache/worldgen/torch
        XDG_CACHE_HOME: /data/model_cache/worldgen/xdg
        HF_HUB_DISABLE_XET: "1"
        PYTORCH_ALLOC_CONF: expandable_segments:True
        RUNNER_ADAPTER: runner_wrapper.adapter:run_job
      env_passthrough:
        - HF_TOKEN
